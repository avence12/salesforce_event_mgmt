<template>
    <lightning-card title="Import External Contact List" icon-name="standard:contact_list">
        <div class="slds-p-around_medium">
            <!-- Progress -->
            <div class="slds-progress slds-progress_horizontal slds-m-bottom_medium">
                <ol class="slds-progress__list">
                    <li class={step1Class}>
                        <span class="slds-progress__marker"></span
                        ><span class="slds-progress__item_content">1 Upload File</span>
                    </li>
                    <li class={step2Class}>
                        <span class="slds-progress__marker"></span
                        ><span class="slds-progress__item_content">2 Preview Changes</span>
                    </li>
                    <li class={step3Class}>
                        <span class="slds-progress__marker"></span
                        ><span class="slds-progress__item_content">3 Apply Results</span>
                    </li>
                </ol>
            </div>

            <template lwc:if={error}>
                <div class="slds-text-color_error slds-m-bottom_small" role="alert">{error}</div>
            </template>
            <template lwc:if={loading}>
                <lightning-spinner alternative-text="Working…" size="medium"></lightning-spinner>
            </template>

            <!-- STEP 1 -->
            <template lwc:if={isStep1}>
                <p class="slds-m-bottom_small slds-text-color_weak">
                    Upload a CSV (.csv) file — comma, semicolon or tab separated. Each row is matched to someone already
                    in the org by name, then company, then email, and matched people get an event tag. Expected headers:
                    First Name, Last Name, Email, Company, <b>Event</b> (Title and Mobile optional).
                </p>
                <p class="slds-m-bottom_small slds-text-color_weak">
                    Save it as <b>UTF-8</b> (in Excel: File → Save As → “CSV UTF-8”), otherwise accented names cannot be
                    read.
                </p>
                <lightning-input
                    type="file"
                    label="CSV file (.csv)"
                    accept=".csv"
                    onchange={handleFileChange}
                ></lightning-input>
            </template>

            <!-- STEP 2 -->
            <template lwc:if={isStep2}>
                <p class="slds-m-bottom_small">Uploaded: <b>{fileName}</b> ({rowCount} rows)</p>

                <div class="slds-grid slds-gutters slds-m-bottom_medium slds-wrap">
                    <div class="slds-col">
                        <div class="stat"><b>{stats.matchedCount}</b><span>Matched contacts</span></div>
                    </div>
                    <div class="slds-col">
                        <div class="stat"><b>{stats.matchedLeadCount}</b><span>Matched leads</span></div>
                    </div>
                    <div class="slds-col">
                        <div class="stat"><b>{stats.newLeadCount}</b><span>New leads (will create)</span></div>
                    </div>
                    <div class="slds-col">
                        <div class="stat"><b>{stats.ambiguousCount}</b><span>Ambiguous (manual)</span></div>
                    </div>
                    <div class="slds-col">
                        <div class="stat"><b>{stats.skippedCount}</b><span>Skipped (invalid)</span></div>
                    </div>
                </div>

                <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col" style="width: 2rem"></th>
                            <th scope="col">Name</th>
                            <th scope="col">Email</th>
                            <th scope="col">How it matched</th>
                            <th scope="col">Type</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={previewRows} for:item="r">
                            <tr key={r.key}>
                                <td>
                                    <input
                                        type="checkbox"
                                        data-key={r.key}
                                        checked={r.selected}
                                        disabled={r.disabled}
                                        onchange={handleRowToggle}
                                    />
                                </td>
                                <td>{r.name}</td>
                                <td>{r.email}</td>
                                <td>{r.changeText}</td>
                                <td><span class={r.badgeClass}>{r.typeLabel}</span></td>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <div class="slds-grid slds-grid_align-spread slds-m-top_medium">
                    <div>
                        <template lwc:if={hasAmbiguous}>
                            <lightning-button
                                label="Download Manual-Review List"
                                onclick={handleDownloadManualList}
                            ></lightning-button>
                        </template>
                    </div>
                    <div>
                        <lightning-button
                            label="Back"
                            onclick={handleBack}
                            class="slds-m-right_x-small"
                        ></lightning-button>
                        <lightning-button
                            variant="brand"
                            label={applyLabel}
                            disabled={applyDisabled}
                            onclick={handleApply}
                        ></lightning-button>
                    </div>
                </div>
            </template>

            <!-- STEP 3 -->
            <template lwc:if={isStep3}>
                <template lwc:if={applyResult}>
                    <div class="slds-text-heading_medium slds-m-bottom_small">Import complete ✅</div>
                    <p>
                        <b>{applyResult.tagsRecorded}</b> event tag(s) recorded,
                        <b>{applyResult.leadsCreated}</b> lead(s) created for people who matched nobody.<br />
                        No contact was created, changed or deleted, and no account was created.
                    </p>
                    <template lwc:if={hasAmbiguous}>
                        <p class="slds-m-top_small slds-text-color_weak">
                            <b>{stats.ambiguousCount}</b> row(s) matched more than one person and could not be told
                            apart, so nothing was written for them — download the list and decide by hand. Starting
                            another import discards it.
                        </p>
                        <lightning-button
                            class="slds-m-top_x-small"
                            label="Download Manual-Review List"
                            icon-name="utility:download"
                            onclick={handleDownloadManualList}
                        ></lightning-button>
                    </template>
                </template>
                <div class="slds-m-top_medium">
                    <lightning-button label="Import Another File" onclick={handleStartOver}></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
