<template>
    <!-- Renders nothing when the current user has no pending items for this event -->
    <template lwc:if={hasPending}>
        <lightning-card title="Pending Your Approval" icon-name="standard:approval">
            <div class="slds-p-around_medium">
                <template lwc:if={loading}>
                    <lightning-spinner alternative-text="Working…" size="medium"></lightning-spinner>
                </template>

                <template lwc:if={externalMode}>
                    <div class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small slds-text-body_small">
                        Approvals for this event are handled in the corporate approval system.
                        This list is read-only and updates automatically as decisions sync back.
                    </div>
                </template>

                <template lwc:if={canDecide}>
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small slds-wrap">
                        <label class="slds-checkbox_toggle">
                            <input type="checkbox" checked={allSelected} onchange={handleSelectAll} />
                            <span class="slds-m-left_x-small">{selectAllLabel}</span>
                        </label>
                        <div>
                            <lightning-button label={rejectLabel} disabled={actionsDisabled}
                                              onclick={handleReject} class="slds-m-right_x-small"></lightning-button>
                            <lightning-button variant="brand" label={approveLabel} disabled={actionsDisabled}
                                              onclick={handleApprove}></lightning-button>
                        </div>
                    </div>
                </template>

                <template for:each={groups} for:item="g">
                    <div key={g.accountId} class="slds-m-bottom_small">
                        <div class="group-header slds-p-around_x-small"><b>{g.accountName}</b></div>
                        <template for:each={g.rows} for:item="r">
                            <div key={r.inviteeId} class="row slds-grid slds-grid_vertical-align-center slds-p-vertical_x-small">
                                <template lwc:if={canDecide}>
                                    <input type="checkbox" data-id={r.inviteeId} checked={r.selected}
                                           onchange={handleToggle} class="slds-m-right_small" />
                                </template>
                                <div class="slds-col">
                                    <div>{r.nameTitle}</div>
                                    <div class="slds-text-body_small slds-text-color_weak">Added by {r.addedByName}</div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template lwc:if={canDecide}>
                    <p class="slds-text-color_weak slds-text-body_small">
                        On completion the submitting AM is notified automatically and can export the approved list.
                    </p>
                </template>
            </div>
        </lightning-card>
    </template>
</template>
