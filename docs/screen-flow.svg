<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8b9b"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a9856a"/>
    </marker>
    <marker id="arrowSm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93a0ae"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- ============ TITLE ============ -->
  <text x="60" y="62" font-size="31" font-weight="700" fill="#16202e">Event Management — Screen Flow</text>
  <text x="60" y="92" font-size="16.5" fill="#68788a">Five screens, two roles. Any number of AMs share one event — each submits and exports their own batch.</text>

  <!-- ============ AM LANE ============ -->
  <rect x="60" y="122" width="1480" height="268" rx="10" fill="#f5f8fd" stroke="#d9e3f3" stroke-width="1.5"/>
  <rect x="60" y="122" width="6" height="268" rx="3" fill="#2563eb"/>
  <text x="80" y="148" font-size="14" font-weight="700" fill="#2563eb" letter-spacing="1.1">AM — ACCOUNT MANAGER</text>

  <!-- Box 1: Import -->
  <rect x="90" y="164" width="310" height="196" rx="9" fill="#ffffff" stroke="#c5d5ef" stroke-width="1.5"/>
  <circle cx="118" cy="192" r="15" fill="#2563eb"/>
  <text x="118" y="198" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="144" y="192" font-size="17.5" font-weight="700" fill="#16202e">Import Contact List</text>
  <text x="144" y="211" font-size="12.5" fill="#8493a3">Tab · Import Contacts</text>
  <text x="112" y="248" font-size="13.5" fill="#3d4a5a">• Upload CSV (UTF-8)</text>
  <text x="112" y="273" font-size="13.5" fill="#3d4a5a">• Diff vs existing Contacts, by email</text>
  <text x="112" y="298" font-size="13.5" fill="#3d4a5a">• Apply — creates and updates</text>
  <text x="112" y="330" font-size="12.5" fill="#8493a3">Company changes → manual list</text>

  <!-- Box 2: Create Event -->
  <rect x="460" y="164" width="310" height="196" rx="9" fill="#ffffff" stroke="#c5d5ef" stroke-width="1.5"/>
  <circle cx="488" cy="192" r="15" fill="#2563eb"/>
  <text x="488" y="198" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="514" y="192" font-size="17.5" font-weight="700" fill="#16202e">Create Event</text>
  <text x="514" y="211" font-size="12.5" fill="#8493a3">Standard record form</text>
  <text x="482" y="248" font-size="13.5" fill="#3d4a5a">• Name, date, location, type</text>
  <text x="482" y="273" font-size="13.5" fill="#3d4a5a">• Owner = you</text>
  <text x="482" y="298" font-size="13.5" fill="#3d4a5a">• No status field — see the</text>
  <text x="492" y="318" font-size="13.5" fill="#3d4a5a">roll-up counters instead</text>

  <!-- Box 3: Add & Submit -->
  <rect x="830" y="164" width="310" height="196" rx="9" fill="#ffffff" stroke="#c5d5ef" stroke-width="1.5"/>
  <circle cx="858" cy="192" r="15" fill="#2563eb"/>
  <text x="858" y="198" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="884" y="192" font-size="17.5" font-weight="700" fill="#16202e">Add &amp; Submit</text>
  <text x="884" y="211" font-size="12.5" fill="#8493a3">Event record page</text>
  <text x="852" y="248" font-size="13.5" fill="#3d4a5a">• Contacts from your accounts</text>
  <text x="852" y="273" font-size="13.5" fill="#3d4a5a">• Add → Draft</text>
  <text x="852" y="298" font-size="13.5" fill="#3d4a5a">• Submit your own batch</text>
  <text x="852" y="330" font-size="12.5" fill="#8493a3">Other AMs' picks are untouched</text>

  <!-- Box 5: Export -->
  <rect x="1200" y="164" width="310" height="196" rx="9" fill="#ffffff" stroke="#c5d5ef" stroke-width="1.5"/>
  <circle cx="1228" cy="192" r="15" fill="#2563eb"/>
  <text x="1228" y="198" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1254" y="192" font-size="17.5" font-weight="700" fill="#16202e">Export Approved</text>
  <text x="1254" y="211" font-size="12.5" fill="#8493a3">Event page · Approved Exports tab</text>
  <text x="1222" y="248" font-size="13.5" fill="#3d4a5a">• One event, or all at once</text>
  <text x="1222" y="273" font-size="13.5" fill="#3d4a5a">• Optional approval date range</text>
  <text x="1222" y="298" font-size="13.5" fill="#3d4a5a">• Re-export is always complete</text>
  <text x="1222" y="330" font-size="12.5" fill="#8493a3">CSV download</text>

  <!-- AM lane arrows -->
  <line x1="404" y1="262" x2="452" y2="262" stroke="#7d8b9b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="774" y1="262" x2="822" y2="262" stroke="#7d8b9b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ OWNER LANE ============ -->
  <rect x="60" y="428" width="1480" height="212" rx="10" fill="#fdf8f1" stroke="#f0e0ca" stroke-width="1.5"/>
  <rect x="60" y="428" width="6" height="212" rx="3" fill="#b45309"/>
  <text x="80" y="454" font-size="14" font-weight="700" fill="#b45309" letter-spacing="1.1">ACCOUNT OWNER — APPROVER</text>

  <text x="100" y="510" font-size="14" font-weight="600" fill="#8a6a3c">Owners are pulled in, they never go looking.</text>
  <text x="100" y="537" font-size="13" fill="#9c8b76">The notification links straight to the event, and the console shows</text>
  <text x="100" y="558" font-size="13" fill="#9c8b76">nothing at all when they have no invitees waiting on them.</text>
  <text x="100" y="590" font-size="13" fill="#9c8b76">Works the same in the Salesforce Mobile App — sign off from a phone.</text>

  <!-- Box 4: Approve -->
  <rect x="860" y="470" width="392" height="150" rx="9" fill="#ffffff" stroke="#eed4b2" stroke-width="1.5"/>
  <circle cx="888" cy="498" r="15" fill="#b45309"/>
  <text x="888" y="504" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="914" y="498" font-size="17.5" font-weight="700" fill="#16202e">Approve or Reject</text>
  <text x="914" y="517" font-size="12.5" fill="#9c8b76">Event record page · desktop &amp; mobile</text>
  <text x="882" y="553" font-size="13.5" fill="#3d4a5a">• Only invitees under your accounts</text>
  <text x="882" y="578" font-size="13.5" fill="#3d4a5a">• Pre-selected — Select All → Approve</text>
  <text x="882" y="603" font-size="13.5" fill="#3d4a5a">• Reject asks you to confirm first</text>

  <!-- Submit arrow: box3 down to box4 -->
  <path d="M 1010 364 L 1010 466" fill="none" stroke="#7d8b9b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1026" y="400" font-size="13" font-weight="600" fill="#4a5866">Submit batch</text>
  <text x="1026" y="419" font-size="12.5" fill="#7d8b9b">→ email + bell to each owner</text>

  <!-- Reviewed arrow: box4 right, up to box5 -->
  <path d="M 1256 545 L 1330 545 L 1330 368" fill="none" stroke="#7d8b9b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1346" y="440" font-size="13" font-weight="600" fill="#4a5866">Batch fully reviewed</text>
  <text x="1346" y="459" font-size="12.5" fill="#7d8b9b">→ email + bell to the AM</text>

  <!-- Rejected loop back to box 3 -->
  <path d="M 900 624 L 900 672 L 790 672 L 790 336 L 822 336" fill="none" stroke="#a9856a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <text x="918" y="669" font-size="12.5" font-weight="600" fill="#a9856a">Rejected → back on the AM's list; re-adding resets it to Draft</text>

  <!-- ============ STATUS LIFECYCLE ============ -->
  <line x1="60" y1="706" x2="1540" y2="706" stroke="#e6eaef" stroke-width="1.5"/>
  <text x="60" y="746" font-size="14" font-weight="700" fill="#68788a" letter-spacing="1.1">INVITEE STATUS</text>
  <text x="60" y="768" font-size="12.5" fill="#93a0ae">One row per contact</text>
  <text x="60" y="786" font-size="12.5" fill="#93a0ae">per event</text>

  <rect x="250" y="762" width="112" height="42" rx="21" fill="#eef2f7" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="306" y="789" font-size="14.5" font-weight="600" fill="#3d4a5a" text-anchor="middle">Draft</text>

  <line x1="366" y1="783" x2="404" y2="783" stroke="#93a0ae" stroke-width="2" marker-end="url(#arrowSm)"/>

  <rect x="408" y="762" width="196" height="42" rx="21" fill="#fff5e6" stroke="#eed4b2" stroke-width="1.5"/>
  <text x="506" y="789" font-size="14.5" font-weight="600" fill="#8a5a12" text-anchor="middle">Pending Approval</text>

  <path d="M 608 783 L 634 783 L 634 750 L 664 750" fill="none" stroke="#93a0ae" stroke-width="2" marker-end="url(#arrowSm)"/>
  <path d="M 608 783 L 634 783 L 634 818 L 664 818" fill="none" stroke="#93a0ae" stroke-width="2" marker-end="url(#arrowSm)"/>

  <rect x="668" y="729" width="132" height="42" rx="21" fill="#ecf7ef" stroke="#c2e0cc" stroke-width="1.5"/>
  <text x="734" y="756" font-size="14.5" font-weight="600" fill="#1f6b3a" text-anchor="middle">Approved</text>

  <line x1="804" y1="750" x2="842" y2="750" stroke="#93a0ae" stroke-width="2" marker-end="url(#arrowSm)"/>

  <rect x="846" y="729" width="126" height="42" rx="21" fill="#eef2f7" stroke="#cfd8e3" stroke-width="1.5"/>
  <text x="909" y="756" font-size="14.5" font-weight="600" fill="#3d4a5a" text-anchor="middle">Exported</text>
  <text x="909" y="789" font-size="12" fill="#93a0ae" text-anchor="middle">downloaded once</text>

  <rect x="668" y="797" width="132" height="42" rx="21" fill="#fdeeee" stroke="#f0c9c9" stroke-width="1.5"/>
  <text x="734" y="824" font-size="14.5" font-weight="600" fill="#9c2c2c" text-anchor="middle">Rejected</text>
  <text x="812" y="823" font-size="12.5" fill="#93a0ae">re-add → Draft</text>

  <!-- Right-hand callout -->
  <rect x="1130" y="729" width="410" height="110" rx="9" fill="#f7f9fc" stroke="#dde5ef" stroke-width="1.5"/>
  <text x="1152" y="756" font-size="13.5" font-weight="700" fill="#16202e">The event has no status of its own</text>
  <text x="1152" y="780" font-size="12.5" fill="#5b6b7c">Several AMs submit independently, so a single event-level</text>
  <text x="1152" y="799" font-size="12.5" fill="#5b6b7c">state would deadlock. The event page shows counters —</text>
  <text x="1152" y="818" font-size="12.5" fill="#5b6b7c">Pending · Approved · Rejected · Exported — instead.</text>
</svg>
